<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in with Google</title>
<!-- PROTOTYPE STAND-IN for Google's account chooser popup (Appy: "Continue with
     Google" should open Google's side window, not our own form). It only picks an
     email and hands it back to the page that opened it (js/google.js); it never
     asks for a password. The real one is Google's OAuth window. -->
<style>
  /* Google's chooser responds to the window: a wide one (a tab) shows a grey
     page with a rounded card, title left and accounts right; a popup-sized one
     is a single white column */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #f0f4f9; color: #1f1f1f; font: 400 14px/1.45 "Google Sans", Roboto, Arial, sans-serif; }
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 48px; width: 100%; max-width: 1040px; padding: 36px 36px 48px; border-radius: 28px; background: #fff; }
  .g-logo { width: 48px; height: 48px; margin-bottom: 18px; }
  h1 { margin: 0 0 12px; font: 400 36px/1.25 "Google Sans", Arial, sans-serif; }
  .g-sub { margin: 0; color: #1f1f1f; font-size: 16px; }
  .g-sub b { color: #0b57d0; font-weight: 500; }
  .g-right { padding-top: 66px; }
  ul { margin: 0; padding: 0; list-style: none; }
  li + li { border-top: 1px solid #c4c7c5; }
  li button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 8px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  li button:hover, li button:focus-visible { outline: 0; background: #f2f2f2; }
  .av { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font: 500 14px/1 Arial, sans-serif; }
  .who b { display: block; font-weight: 500; }
  .who small { color: #444746; font-size: 12px; }
  .other .av { background: none; color: #444746; }
  form { display: none; }
  form.is-on { display: block; }
  input { width: 100%; height: 56px; padding: 0 14px; border: 1px solid #747775; border-radius: 4px; font: 16px Arial, sans-serif; }
  input:focus { outline: 0; border: 2px solid #0b57d0; padding: 0 13px; }
  .err { min-height: 20px; margin: 6px 0 0; color: #b3261e; font-size: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .link { padding: 10px 8px; border: 0; background: none; color: #0b57d0; font: 500 14px Arial, sans-serif; cursor: pointer; }
  .next { height: 40px; padding: 0 24px; border: 0; border-radius: 20px; background: #0b57d0; color: #fff; font: 500 14px Arial, sans-serif; cursor: pointer; }
  .fine { grid-column: 2; margin: 8px 0 0; color: #444746; font-size: 12px; }
  .g-foot { display: flex; justify-content: space-between; width: 100%; max-width: 1040px; padding: 16px 12px 0; color: #444746; font-size: 12px; }
  .g-foot span + span { margin-left: 28px; }
  @media (max-width: 840px) {
    body { justify-content: flex-start; padding: 0; background: #fff; }
    .g { grid-template-columns: 1fr; gap: 20px; padding: 24px 24px 32px; border-radius: 0; }
    .g-logo { width: 40px; height: 40px; margin-bottom: 14px; }
    h1 { font-size: 28px; }
    .g-right { padding-top: 0; }
    .fine { grid-column: 1; }
    .g-foot { padding: 0 24px 16px; margin-top: auto; }
  }
</style>
</head>
<body>
<div class="g">
  <div class="g-left">
    <svg class="g-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.2Z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z" fill="#34A853"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z" fill="#FBBC05"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4 5.6-4Z" fill="#EA4335"/></svg>
    <h1 data-h>Choose an account</h1>
    <p class="g-sub">to continue to <b>onBlue</b></p>
  </div>
  <div class="g-right">
    <div data-pick><ul data-list></ul></div>
    <form data-form novalidate>
      <input type="email" placeholder="Email or phone" aria-label="Email" autocomplete="email" data-email>
      <p class="err" data-err></p>
      <div class="row"><button class="link" type="button" data-back>Back</button><button class="next" type="submit">Next</button></div>
    </form>
  </div>
  <p class="fine">Before using onBlue, Google will share your name, email address and profile picture with it.</p>
</div>
<div class="g-foot"><span>English (United States)</span><span><span>Help</span><span>Privacy</span><span>Terms</span></span></div>
<script>
(function () {
  'use strict';
  // the accounts "signed in to this browser": the address the page already knows, if any, then a personal one
  var hint = '', list = [];
  try { hint = String(JSON.parse(localStorage.getItem('onblue-google-hint') || 'null') || '').toLowerCase(); localStorage.removeItem('onblue-google-hint'); } catch (e) { hint = ''; }
  if (hint) { list.push(hint); }
  ['sam@northline-coffee.com', 'sam.rivera@gmail.com'].forEach(function (x) { if (list.indexOf(x) < 0 && list.length < 2) { list.push(x); } });
  var COLORS = ['#1a73e8', '#188038', '#c5221f'];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function nameOf(m) { return m.split('@')[0].split(/[._-]+/).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' '); }
  document.querySelector('[data-list]').innerHTML = list.map(function (m, i) {
    return '<li><button type="button" data-mail="' + esc(m) + '"><span class="av" style="background:' + COLORS[i % 3] + '">' + esc(m.charAt(0).toUpperCase()) + '</span><span class="who"><b>' + esc(nameOf(m)) + '</b><small>' + esc(m) + '</small></span></button></li>';
  }).join('') + '<li class="other"><button type="button" data-other><span class="av"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="who"><b>Use another account</b></span></button></li>';

  // framed in the page's popup (js/google.js): tell the parent; opened on its own: tell the opener and close
  var host = window.opener || (window.parent !== window ? window.parent : null);
  function done(email) {
    if (host) { host.postMessage({ ob: 'google', email: email }, location.origin); }
    if (window.opener) { window.close(); }
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && host) { host.postMessage({ ob: 'google-close' }, location.origin); } });
  var pick = document.querySelector('[data-pick]'), form = document.querySelector('[data-form]'), inp = document.querySelector('[data-email]'), err = document.querySelector('[data-err]'), h = document.querySelector('[data-h]');
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-mail]'); if (b) { done(b.getAttribute('data-mail')); return; }
    if (ev.target.closest('[data-other]')) { pick.hidden = true; form.classList.add('is-on'); h.textContent = 'Sign in'; inp.focus(); return; }
    if (ev.target.closest('[data-back]')) { form.classList.remove('is-on'); pick.hidden = false; h.textContent = 'Choose an account'; err.textContent = ''; }
  });
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { err.textContent = 'Enter a valid email'; inp.focus(); return; }
    done(v);
  });
})();
</script>
</body>
</html>
