<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<!-- the source of a share image, served only because the image beside it is;
     not a page anybody should land on from a search -->
<meta name="robots" content="noindex">
<title>onBlue share card, business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="../onblue.css">
<link rel="stylesheet" href="og.css">
</head>
<body>
<!-- THE BUSINESS CARD. Source for og-business.png; render with og/render.js.
     The frames are the posters of the films the site's ring plays, from
     samples/, mixed across the three advertisers so the ring does not read as
     one brand's campaign. -->
<main class="og og--business" id="og">
  <div class="hero-media" aria-hidden="true"></div>

  <header class="og-top">
    <span class="logo">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6C12.55 2.6 12.88 3.15 13.08 4.7c.62 4.7 1.52 5.6 6.22 6.22 1.55.2 2.1.53 2.1 1.08s-.55.88-2.1 1.08c-4.7.62-5.6 1.52-6.22 6.22-.2 1.55-.53 2.1-1.08 2.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15 12.88 2.6 12.55 2.6 12s.55-.88 2.1-1.08c4.7-.62 5.6-1.52 6.22-6.22C11.12 3.15 11.45 2.6 12 2.6Z"/></svg>
      onBlue
    </span>
    <span class="eyebrow">For businesses</span>
  </header>

  <div class="og-copy">
    <h1 class="og-title">Creator marketing,<br><em>done for you.</em></h1>
  </div>

  <div class="og-ring" aria-hidden="true">
    <div class="og-stage">
      <div class="og-tile is-edge" style="--a: 54deg"><img src="../samples/airtap-red-eye.jpg" alt=""></div>
      <div class="og-tile" style="--a: 36deg"><img src="../samples/hunter-raid-first-hour.jpg" alt=""></div>
      <div class="og-tile" style="--a: 18deg"><img src="../samples/airtap-pasta.jpg" alt=""></div>
      <div class="og-tile" style="--a: 0deg"><img src="../samples/sandbar-think-out-loud.jpg" alt=""></div>
      <div class="og-tile" style="--a: -18deg"><img src="../samples/hunter-raid-awaken.jpg" alt=""></div>
      <div class="og-tile" style="--a: -36deg"><img src="../samples/airtap-date-night.jpg" alt=""></div>
      <div class="og-tile is-edge" style="--a: -54deg"><img src="../samples/sandbar-the-menu.jpg" alt=""></div>
    </div>
  </div>
</main>

<script src="../ascii-field.js"></script>
<script>
  if (window.onblueField) {
    window.onblueField({ host: document.getElementById('og'), pointer: false });
  }
</script>
</body>
</html>
