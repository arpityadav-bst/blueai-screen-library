<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<!-- the source of a share image, served only because the image beside it is;
     not a page anybody should land on from a search -->
<meta name="robots" content="noindex">
<title>onBlue share card, business, variation B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="../onblue.css">
<link rel="stylesheet" href="og.css">
</head>
<body>
<!-- THE BUSINESS CARD, VARIATION B. Source for og-business-b.png. The same
     promise, the same pay line and the same films as og-business.html, on the
     portal's blue band, arranged as one line over a row. -->
<main class="og og--b og--business" id="og">
  <img class="og-grid" src="grid.svg" alt="">

  <header class="og-top">
    <span class="logo">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6C12.55 2.6 12.88 3.15 13.08 4.7c.62 4.7 1.52 5.6 6.22 6.22 1.55.2 2.1.53 2.1 1.08s-.55.88-2.1 1.08c-4.7.62-5.6 1.52-6.22 6.22-.2 1.55-.53 2.1-1.08 2.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15 12.88 2.6 12.55 2.6 12s.55-.88 2.1-1.08c4.7-.62 5.6-1.52 6.22-6.22C11.12 3.15 11.45 2.6 12 2.6Z"/></svg>
      <span><span class="logo-on">on</span>Blue</span>
    </span>
  </header>

  <div class="og-copy">
    <h1 class="og-promise">Creator marketing, <em>done for you.</em></h1>
    <p class="og-sub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.2 11 15l5-5.6"/></svg>
      You pay per verified view.
    </p>
  </div>

  <!-- five of the films the site's ring plays, across all three advertisers -->
  <div class="og-art og-row" aria-hidden="true">
    <img src="../samples/airtap-red-eye.jpg" alt="">
    <img src="../samples/hunter-raid-first-hour.jpg" alt="">
    <img src="../samples/sandbar-think-out-loud.jpg" alt="">
    <img src="../samples/airtap-pasta.jpg" alt="">
    <img src="../samples/sandbar-the-menu.jpg" alt="">
  </div>
</main>
</body>
</html>
