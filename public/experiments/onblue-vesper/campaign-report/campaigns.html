<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaigns list prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%232f6dff%22%3E%3Cpath%20d%3D%22M12%202.6C12.55%202.6%2012.88%203.15%2013.08%204.7c.62%204.7%201.52%205.6%206.22%206.22%201.55.2%202.1.53%202.1%201.08s-.55.88-2.1%201.08c-4.7.62-5.6%201.52-6.22%206.22-.2%201.55-.53%202.1-1.08%202.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15%2012.88%202.6%2012.55%202.6%2012s.55-.88%202.1-1.08c4.7-.62%205.6-1.52%206.22-6.22C11.12%203.15%2011.45%202.6%2012%202.6Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="report.css">
<link rel="stylesheet" href="campaigns.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="campaigns.html" aria-label="onBlue">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#2f6dff" aria-hidden="true"><path d="M12 2.6C12.55 2.6 12.88 3.15 13.08 4.7c.62 4.7 1.52 5.6 6.22 6.22 1.55.2 2.1.53 2.1 1.08s-.55.88-2.1 1.08c-4.7.62-5.6 1.52-6.22 6.22-.2 1.55-.53 2.1-1.08 2.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15 12.88 2.6 12.55 2.6 12s.55-.88 2.1-1.08c4.7-.62 5.6-1.52 6.22-6.22C11.12 3.15 11.45 2.6 12 2.6Z"/></svg>
      <span><i>on</i>Blue</span>
    </a>
    <div class="top-user">
      <span>Abhisht</span>
      <a class="top-out" href="#">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
        Log out
      </a>
    </div>
  </div>
</header>

<main class="page">

  <div class="list-head">
    <div>
      <h1 class="list-title">Campaigns</h1>
      <p class="list-sub" id="list-sub" hidden></p>
    </div>
    <div class="list-actions">
      <button class="btn icon-btn btn--lg" type="button" id="btn-refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 11.7a8.4 8.4 0 1 1-2.5-5.4"/><path d="M20.4 3.1v4.8h-4.8"/></svg>
      </button>
      <button class="btn btn--solid btn--lg" type="button" id="btn-new">+ New campaign</button>
    </div>
  </div>

  <div class="tiles tiles--three list-tiles" id="tiles"></div>

  <section class="band">
    <div class="band-head">
      <h2 class="band-h">Your campaigns</h2>
      <label class="search" id="mine-search" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="f-q" type="search" placeholder="Search by name or ID" autocomplete="off" aria-label="Search your campaigns">
      </label>
      <div class="filter-wrap" id="filter-wrap">
        <button class="btn icon-btn btn--lg filter-btn" type="button" id="btn-filter" aria-label="Filter your campaigns" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5h17l-6.6 8v5.6l-3.8 1.9V13z"/></svg>
        </button>
        <div class="fmenu" id="fmenu" hidden></div>
      </div>
    </div>
    <div class="filters mine-filters" id="mine-filters" hidden></div>
    <div id="mine"></div>
  </section>

  <section class="band" id="samples-band">
    <div class="band-head"><h2 class="band-h">Sample reports</h2></div>
    <div id="samples"></div>
  </section>

</main>

<div class="toast" id="toast" role="status" hidden></div>

<!-- Prototype review controls, not part of the product: one look at a time on
     the real page. -->
<div class="devdock" aria-label="Prototype controls">
  <div class="devbar">
    <b>Version</b>
    <button type="button" data-version="current" aria-pressed="false">Current (live)</button>
    <button type="button" data-version="new" aria-pressed="true">New</button>
  </div>
  <div class="devbar">
    <b>Brand</b>
    <button type="button" data-state="done" aria-pressed="true">Has a completed campaign</button>
    <button type="button" data-state="running" aria-pressed="false">Nothing completed yet</button>
    <button type="button" data-state="empty" aria-pressed="false">No campaigns yet</button>
  </div>
</div>

<script src="campaigns.js"></script>
</body>
</html>
