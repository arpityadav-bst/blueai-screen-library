<!doctype html>
<html lang="en" class="app" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Campaigns, onBlue for business</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%23156efe%22%3E%3Cpath%20d%3D%22M12%202.6C12.55%202.6%2012.88%203.15%2013.08%204.7c.62%204.7%201.52%205.6%206.22%206.22%201.55.2%202.1.53%202.1%201.08s-.55.88-2.1%201.08c-4.7.62-5.6%201.52-6.22%206.22-.2%201.55-.53%202.1-1.08%202.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15%2012.88%202.6%2012.55%202.6%2012s.55-.88%202.1-1.08c4.7-.62%205.6-1.52%206.22-6.22C11.12%203.15%2011.45%202.6%2012%202.6Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="../onblue.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/new-dialog.css">
<link rel="stylesheet" href="css/campaigns.css">
<link rel="stylesheet" href="css/start.css">
<link rel="stylesheet" href="css/sky.css">
</head>
<body data-page="campaigns">

<aside class="app-side" id="side" aria-label="Main"></aside>

<main class="app-panel">
  <div class="app-body">
    <!-- PM's page head (campaign-report/campaigns.html .list-head): the title is
         the page's, not a bar's, so there is no sticky header here -->
    <div class="list-head">
      <button class="app-btn app-btn--icon app-btn--quiet app-menu-btn" type="button" data-nav-open aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="list-titles">
        <h1 class="list-title">Campaigns</h1>
        <p class="list-sub" id="sub" hidden></p>
      </div>
      <div class="list-actions">
        <button class="app-btn app-btn--lg app-btn--icon" type="button" data-refresh="list" aria-label="Refresh" title="Refresh">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg>
        </button>
        <button class="app-btn app-btn--lg app-btn--solid" type="button" id="head-new" data-new>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New campaign
        </button>
      </div>
    </div>

    <!-- an account with no campaigns: the page is one card, and the card is the button -->
    <section class="start" id="empty" hidden>
      <a class="start-card" href="new.html" data-new>
        <span class="start-copy">
          <span class="start-title">Start your first <em>campaign.</em></span>
          <span class="start-lede" id="empty-create-sub">Set a budget and grow on YouTube. You pay only for what your campaign delivers.</span>
          <span class="app-btn app-btn--solid app-btn--lg start-cta">Create a campaign <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </span>
        <!-- films creators made for brands, as on the homepage; start-art.js fills and turns the fan -->
        <span class="start-art" aria-hidden="true"></span>
      </a>
    </section>

    <section class="app-sect" id="mine-sect" hidden>
      <div class="band-head">
        <h2 class="app-sect-title">Your campaigns</h2>
        <label class="search" id="search" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="Search by name or ID" autocomplete="off" aria-label="Search your campaigns">
        </label>
      </div>
      <div class="toolbar" id="toolbar" hidden>
        <div id="pills" class="pills"></div>
        <span class="count" id="count"></span>
      </div>
      <div id="mine"></div>
    </section>

    <section class="app-sect" id="samples" hidden>
      <div class="band-head"><h2 class="app-sect-title">Sample reports</h2></div>
      <div id="sample-list"></div>
    </section>
  </div>
</main>

<!-- unfinished drafts float at the bottom right, never on top of the page's own content -->
<div class="notices" id="notices" aria-label="Notifications">
  <section class="needs notice" id="needs" aria-label="Drafts to finish" hidden></section>
</div>

<!-- Prototype review controls, not part of the product. -->
<div class="app-dock" aria-label="Prototype controls">
  <div class="app-dock-bar">
    <b>Agency</b>
    <button type="button" data-agency="review">In review</button>
    <button type="button" data-agency="approved">Approved</button>
  </div>
  <div class="app-dock-bar">
    <b>Account</b>
    <button type="button" data-state="first" title="No campaigns yet: the start card, Get started in the sidebar">New account</button>
    <button type="button" data-state="running" title="Campaigns running, none finished yet: sample reports still show">Campaigns running</button>
    <button type="button" data-state="done" title="Has finished campaigns: sample reports step aside">Has finished campaigns</button>
  </div>
</div>

<script src="data.js"></script>
<script src="side-lists.js"></script>
<script src="shell.js"></script>
<script src="filters.js"></script>
<script src="campaigns-table.js"></script>
<script src="campaigns.js"></script>
<script src="new-dialog.js"></script>
<script src="new-drafts.js"></script>
<script src="start-art.js"></script>
</body>
</html>
