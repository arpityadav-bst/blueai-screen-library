<!doctype html>
<html lang="en" class="app" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Settings, onBlue for business</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%23156efe%22%3E%3Cpath%20d%3D%22M12%202.6C12.55%202.6%2012.88%203.15%2013.08%204.7c.62%204.7%201.52%205.6%206.22%206.22%201.55.2%202.1.53%202.1%201.08s-.55.88-2.1%201.08c-4.7.62-5.6%201.52-6.22%206.22-.2%201.55-.53%202.1-1.08%202.1s-.88-.55-1.08-2.1c-.62-4.7-1.52-5.6-6.22-6.22C3.15%2012.88%202.6%2012.55%202.6%2012s.55-.88%202.1-1.08c4.7-.62%205.6-1.52%206.22-6.22C11.12%203.15%2011.45%202.6%2012%202.6Z%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="../onblue.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/flow.css">
<link rel="stylesheet" href="css/agency.css">
</head>
<body data-page="settings">

<aside class="app-side" id="side" aria-label="Main"></aside>

<main class="app-panel">
  <header class="app-head">
    <button class="app-btn app-btn--icon app-btn--quiet app-menu-btn" type="button" data-nav-open aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 class="app-title">Settings</h1>
  </header>

  <div class="app-body">
    <section class="app-sect set-wrap" aria-labelledby="set-agency">
      <div class="app-sect-head">
        <h2 class="app-sect-title" id="set-agency">Agency details</h2>
      </div>
      <form class="set-card" id="set" novalidate>
        <div class="set-body">
          <div class="app-field">
            <label class="label" for="set-name">Agency name</label>
            <div class="agency-input">
              <span class="agency-av" id="set-av" aria-hidden="true"></span>
              <input class="input" id="set-name" name="agency" type="text" autocomplete="organization" placeholder="Your agency name" aria-describedby="set-name-msg">
            </div>
            <p class="help is-err" id="set-name-msg" hidden></p>
          </div>

          <div class="app-field">
            <label class="label" for="set-site"><span>Agency website <span class="opt">(optional)</span></span></label>
            <input class="input" id="set-site" name="site" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://youragency.com">
          </div>

          <div class="app-field">
            <label class="label" for="set-mail">Work email</label>
            <input class="input" id="set-mail" name="work" type="email" readonly aria-describedby="set-mail-help">
            <p class="help" id="set-mail-help">Contact us to change it.</p>
          </div>

          <div class="app-field" role="group" aria-labelledby="set-status-l">
            <span class="label" id="set-status-l">Status</span>
            <p class="set-status"><span class="app-status" id="set-status"></span></p>
            <p class="help" id="set-status-help" hidden>We review every agency before approving it.</p>
          </div>
        </div>

        <div class="set-foot">
          <p class="set-note" id="set-note" aria-live="polite">Changes apply to new campaigns.</p>
          <button class="app-btn app-btn--solid" type="submit" id="set-save" aria-disabled="true">Save</button>
        </div>
      </form>
    </section>
  </div>
</main>

<script src="data.js"></script>
<script src="shell.js"></script>
<script src="agency-kit.js"></script>
<script src="settings.js"></script>
</body>
</html>
