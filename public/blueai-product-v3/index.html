/* Installer copy for Flow A only (BlueStacks talking, installing BlueAI). Flow B (installing
   BlueStacks) no longer uses this modal at all, designer's call (2026-08-10): it's now an
   inline progress card in the chat instead (see needs_bluestacks.jsx's ProgressBubble). The
   'bluestacks' config that used to live here was removed with it, not left as dead data. */
const INSTALLERS = {
  // Copy from the designer's "Full State 1" table (2026-08-11), onboarding-style rewrite,
  // replacing the old single-title/single-body confirm copy. No `skin`/`cancelLabel` anymore:
  // InstallDialog is one skin now (see its file header), and this reference has no secondary
  // button, dismissing via ✕ only.
  blueai: {
    icon: 'assets/spark.svg',   // V3: the onBlue spark, BlueAI's mark (was V2's Logo.png)
    title: 'Meet BlueAI',
    subtitle: 'Your AI worker that gets things done.',
    body: 'Tell BlueAI what you need, in plain words. It handles multi-step tasks across your BlueStacks apps, finds deals, claims rewards, creates content, and more.',
    meta: '182 MB · One-time setup',
    primaryLabel: 'Download BlueAI',
    downloadingLabel: 'Downloading BlueAI…',
    doneLabel: 'BlueAI is installed. Launching it now…',
    downloadMs: 2800,
    doneMs: 900
  }
};

function App() {
  const ProductChatScreen = window.ProductChat.ChatScreen;
  const HistoryScreen = window.ChatHistory.ChatHistoryScreen;
  const ProfileScreen = window.Profile.ProfileScreen;
  const LogoutModal = window.Profile.LogoutModal;
  const [activeTab, setActiveTab] = useState('chat');
  const [sessionKey, setSessionKey] = useState(0);   // bump to reset the chat (New chat)
  // ?ask=… auto-sends that message on load, reusing the same autorun seed the post-login handoff
  // uses. Lets a review link land on a chat state (e.g. the "needs BlueStacks" reply) directly.
  const [seed, setSeed] = useState(QS.get('ask') ? { text: QS.get('ask'), autorun: true, n: 1 } : null);
  const [showLoginModal, setShowLoginModal] = useState(false);
  const [creditsOpen, setCreditsOpen] = useState(false); // AI Credits balance screen
  const [historyOpen, setHistoryOpen] = useState(false); // Chat History in-app screen
  const [profileOpen, setProfileOpen] = useState(false); // Profile in-app screen
  const [logoutOpen, setLogoutOpen] = useState(false);   // Sign out confirm modal
  const [reportOpen, setReportOpen] = useState(false);   // Help > Report issue dialog
  const [booting, setBooting] = useState(true);           // cold-start boot splash
  const [homeReady, setHomeReady] = useState(false);      // skeleton → real content
  const [keyAdded, setKeyAdded] = useState(false);         // has the user configured their own key (any geo)
  const [keyInfo, setKeyInfo] = useState(null);            // { provider, model, key }
  const [byokOn, setByokOn] = useState(false);             // BYOK toggle in Settings
  const [highlightByok, setHighlightByok] = useState(false); // pulse the Settings BYOK card when routed there
  const [zeroCredits, setZeroCredits] = useState(QS.get('credits') === '0');   // preview "out of credits" (drives the on-send popup); ?credits=0 starts there
  const [scheduledOoc, setScheduledOoc] = useState(false); // preview: a SCHEDULED worker run that dies mid-job on zero credits (its own chat, no user message)
  const [showChatStates, setShowChatStates] = useState(false); // preview: show one example bubble per chat message state (success/warning/error) instead of the live scripted task
  const [aiHwSupported, setAiHwSupported] = useState(true);    // preview: does this PC meet Hybrid AI Mode's hardware requirements
  const [aiConflict, setAiConflict] = useState(false);         // preview: another local model (e.g. LM Studio) already running
  const [oocOpen, setOocOpen] = useState(false);           // out-of-credits popup
  const [pendingMessage, setPendingMessage] = useState(null); // onboarding: message that opened the sign-in gate, auto-sent after login
  const [previewOpen, setPreviewOpen] = useState(true);    // dev preview panel collapse
  // BlueAI worker end to end (ROB-21350). workerDay: 'day1' = a new user (Run plays onboarding),
  // 'next' = the following day's scheduled run, replayed per click via dailyRunKey. jobChoice:
  // whether onboarding asks the setup question. permUi: which control opens the mode sheet later
  // (composer chip or ribbon). protoStart: skip sign-in on load. jobWaiting: an unanswered job
  // ask, which lights BlueAI's taskbar button. permModes: the per-app modes, for the Mode row.
  const [protoStart, setProtoStart] = useState(PROTO.start);
  const [permUi, setPermUi] = useState(PROTO.version);
  const { modes: permModes } = window.AgentPermissions.usePermissionMode();
  const [workerDay, setWorkerDay] = useState(LINK.day);
  const [dailyRunKey, setDailyRunKey] = useState(0);
  const [jobChoice, setJobChoice] = useState(LINK.setup);
  const [dayEnd, setDayEnd] = useState(LINK.end);        // how today's run ends (worker_day_done.jsx)
  const [cardStyle, setCardStyle] = useState(LINK.card); // which day-done option draws it: money | days | plain
  const [toast, setToast] = useState(null);              // the Windows notification a scheduled run raises when its day is done
  const [linkCopied, setLinkCopied] = useState(false);
  const linkDayPlayed = useRef(false);   // ?day=next plays its run once, after the first boot
  // A shared link's worker setup lives in module-level stores outside React; apply it once.
  useEffect(() => {
    window.WorkerFlow.setChoicePoint(LINK.setup);
    window.WorkerDayDone.setEnd(LINK.end);
    window.WorkerDayDone.setStyle(LINK.card);
    if (LINK.day !== 'day1') window.WorkerFlow.setOnboarded(true);
    if (LINK.mode === 'auto') window.AgentPermissions.setMode('youtube', 'auto');
  }, []);
  const [jobWaiting, setJobWaiting] = useState(false);
  // The BlueAI-worker welcome IS the starting experience (Abhisht, 2026-09-24): logged out, on
  // the worker session, with the first-run terms sheet up. These three defaults move together,
  // 'moneymaker' must start logged OUT (switchSession derives isLoggedIn the same way).
  const [isLoggedIn, setIsLoggedIn] = useState(PROTO.start === 'worker' || LINK.player === 'accepted');  // within the current session: has sign-in completed (Start at: Worker home skips it; App Player's accepted account signs in silently, ROB-21388)
  const [sessionMode, setSessionMode] = useState('moneymaker'); // preview toggle: which session, Onboarding | Default | MoneyMaker
  // Terms sheet preview: 'firstrun' (blocking first-start acceptance, the default) | 'update'
  // (blocking re-acceptance after a terms change) | 'off'. Its own row rather than a Session
  // option because it overlays ANY session.
  const [termsMode, setTermsMode] = useState(PROTO.start === 'worker' || LINK.signin ? 'off' : 'firstrun');
  const [loginFlow, setLoginFlow] = useState('onboarding');  // which flow opened LoginModal: 'onboarding' (composer-gated) or 'moneymaker' (welcome CTA, opens straight past the default step)
  /* ROB-21388: the browser window the app's Sign in opens, and what it finds there. playerAcct
     and browserSession are the Preview rows (App Player on this PC; what bluestacks.ai holds);
     browserResult is the account the browser handed back. */
  const [browserOpen, setBrowserOpen] = useState(false);
  const [browserKey, setBrowserKey] = useState(0);
  const [browserSession, setBrowserSession] = useState(LINK.browser);   // 'accepted' | 'other' | 'out'
  const [playerAcct, setPlayerAcct] = useState(LINK.player);           // 'out' | 'accepted' | 'other'
  const [browserResult, setBrowserResult] = useState(null);
  const openBrowser = () => { setBrowserResult(null); setBrowserKey((k) => k + 1); setBrowserOpen(true); };
  const [caseId, setCaseId] = useState(SIGNIN_CASES.some((c) => c.id === QS.get('case')) ? QS.get('case') : '1');
  /* Every case is a cold start (Abhisht, 2026-10-07: "BlueAI should always start with the
     launching/splash screen"). What happens after the splash depends only on the shared session:
     App Player signed in = BlueAI signs in silently (home, or the check for another account);
     signed out = BlueAI's sign-in page, and the person clicks Sign in. */
  const playerRef = useRef(playerAcct); playerRef.current = playerAcct;
  const loggedRef = useRef(false); loggedRef.current = isLoggedIn;
  const [opt, setOpt] = useState(QS.get('opt') === 'b' ? 'b' : 'a');
  const optRef = useRef(opt); optRef.current = opt;
  const pickOpt = (v) => { setOpt(v); optRef.current = v; playCase(caseId); };
  const playCase = (id) => {
    setCaseId(id);
    setBrowserOpen(false); setBrowserResult(null); setShowLoginModal(false); setTermsMode('off');
    setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); setLogoutOpen(false); setActiveTab('chat'); setSeed(null);
    setSessionMode('moneymaker'); setOnbPhase('welcome'); setLoginFlow('moneymaker');
    const player = id === '1' ? 'accepted' : (id === '2' ? 'other' : 'out');
    setPlayerAcct(player); playerRef.current = player;
    setBrowserSession(id === '3b' ? 'other' : (id === '3c' ? 'out' : 'accepted'));
    setIsLoggedIn(id === '1' && optRef.current === 'a');   // option B confirms App Player's account first
    setWinOpen(true); setBooting(true); setHomeReady(false); setSessionKey((k) => k + 1);
  };
  // After the splash: App Player on another account means a silent sign-in with it, then the check.
  // Option B: any App Player account gets "Continue as" first.
  const afterBoot = () => {
    if (loggedRef.current || playerRef.current === 'out') return;
    if (optRef.current === 'b') { setLoginFlow('confirm'); setShowLoginModal(true); return; }
    if (playerRef.current === 'other') { setLoginFlow('gate'); setShowLoginModal(true); }
  };
  useEffect(() => { if (CASES_MODE) playCase(caseId); }, []);
  // The browser's "You're signed in" page stays up just long enough to read, then the window goes.
  const handleBrowserContinue = (acct) => { setBrowserResult(acct); setPlayerAcct(acct.id === 'primary' ? 'accepted' : 'other'); setTimeout(() => setBrowserOpen(false), 1400); };
  // ── Desktop install model. Two independent booleans; at least one is always true (see
  // toggleInstalled's guard), because "nothing installed" is not a designed screen.
  // ?bs=0 / ?bai=0 deep-link a starting configuration, so a review link can point straight at
  // the state being reviewed instead of "open it and untick BlueAI". Read once, at mount.
  const [bsInstalled, setBsInstalled] = useState(START.bs);     // BlueStacks App Player present on this PC
  const [baiInstalled, setBaiInstalled] = useState(START.bai);  // BlueAI Windows software present on this PC
  const [winOpen, setWinOpen] = useState(true);             // its window is open (✕ closes it; still installed)
  const [bsScreen, setBsScreen] = useState('home');         // which BlueStacks frame: home | loading | play-youtube
  // ?dlg=blueai opens that installer straight away. Only honoured when BlueAI is genuinely
  // missing: otherwise it would show an install prompt for software that is already installed.
  // (Flow B/BlueStacks has no modal to deep-link into anymore, see INSTALLERS above.)
  const [installing, setInstalling] = useState(() => (QS.get('dlg') === 'blueai' && !START.bai) ? 'blueai' : null);
  const [winJustIn, setWinJustIn] = useState(false);        // play the window's open animation once
  const [onbPhase, setOnbPhase] = useState('welcome');      // onboarding sub-flow: 'welcome' (chrome-free picker) → 'chat'
  const isLoading = !homeReady;
  const DEFAULT_KEY = { provider: 'Anthropic', model: 'claude-haiku-4-5', key: 'sk-ant-9Xsjhdw1qAAA' };
  // V2 grants every member 2000 credits a day, automatically (Appy, 2026-09-09). No tiers and
  // no geo split, so this is a flat constant rather than the old member/geo lookup.
  const DAILY_GRANT = 2000;
  const credits = zeroCredits ? 0 : DAILY_GRANT;
  const byokActive = keyAdded && byokOn;                   // running on the user's own key (any geo)
  const lowDot = credits < 1000 && !byokActive;            // low/empty warning, suppressed while on own key (credits paused)
  const addKey = (info) => { setKeyInfo(info || DEFAULT_KEY); setKeyAdded(true); setByokOn(true); setOocOpen(false); };
  const removeKey = () => { setKeyInfo(null); setKeyAdded(false); };
  // Route into Settings › BYOK (from the out-of-credits popup or the credits-screen row): open
  // Settings, turn BYOK on, and pulse-highlight the section so it's obvious where to add the key.
  const goToByokSettings = () => {
    setOocOpen(false); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false);
    setByokOn(true); setActiveTab('settings'); setHighlightByok(true);
    setTimeout(() => setHighlightByok(false), 2000);
  };
  // After the splash fades, let the skeleton linger briefly, then settle the content in.
  const handleBootDone = () => {
    setBooting(false); setTimeout(() => setHomeReady(true), 850);
    if (LINK.day === 'next' && !linkDayPlayed.current) { linkDayPlayed.current = true; setDailyRunKey((k) => k + 1); }
    if (CASES_MODE) afterBoot();
    else if (LINK.signin === 'browser' && !isLoggedIn) { setLoginFlow(LINK.player === 'other' ? 'gate' : 'moneymaker'); setShowLoginModal(true); }   // ROB-21388 link: the handoff, or the gate when App Player is on another account
  };
  /* Preview panel "Copy link" (ROB-21350): today's setup as a ?query link (see LINK above). It is
     built on this page's own address, so it opens on localhost here and on the real host once the
     prototype is deployed. Worker settings ride along only when the worker home is what's showing. */
  const copyLink = () => {
    const p = new URLSearchParams();
    if (bsInstalled) p.set('bs', '1');
    if (!baiInstalled) p.set('bai', '0');
    if ((!isLoggedIn && showLoginModal) || playerAcct !== 'out') {   // ROB-21388: the sign-in handoff as it is set up now
      p.set('signin', 'browser');
      if (playerAcct !== 'out') p.set('player', playerAcct);
      if (browserSession !== 'accepted') p.set('browser', browserSession);
    }
    if (isLoggedIn && sessionMode === 'moneymaker' && playerAcct === 'out') {
      p.set('start', 'worker');
      p.set('v', permUi === 'chatbox' ? '1' : '2');
      if (jobChoice === 'jobcard') p.set('setup', 'off');
      if (workerDay !== 'day1') p.set('day', workerDay);
      if (workerDay === 'next' && dayEnd !== 'job') p.set('end', dayEnd);
      if (cardStyle !== 'days') p.set('card', cardStyle);
      if (window.AgentPermissions.getMode('youtube') === 'auto') p.set('mode', 'auto');
    }
    const url = location.origin + location.pathname + (p.toString() ? '?' + p.toString() : '');
    const done = () => { setLinkCopied(true); setTimeout(() => setLinkCopied(false), 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => window.prompt('Copy this link', url));
    else window.prompt('Copy this link', url);
  };

  /* ── Desktop: opening / closing / installing the BlueAI window ───────────────────────────
     Opening the window is always a COLD START, the boot splash replays and the chat resets,
     because that is what launching a Windows app does. */
  const openWindow = () => {
    setWinOpen(true);
    setWinJustIn(true); setTimeout(() => setWinJustIn(false), 380);
    setBooting(true); setHomeReady(false);
    setSessionKey((k) => k + 1);
    setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); setLogoutOpen(false);
    setActiveTab('chat'); setSeed(null);
  };
  const winPresent = baiInstalled && winOpen;
  // The BlueStacks window is only clickable when the click DOES something: install BlueAI, or
  // reopen a BlueAI window that was closed with ✕. Otherwise it is scenery.
  // …and never while its own dialog is up, so a click on the dimmed player can't re-fire it.
  const bsLive = (!baiInstalled || !winOpen) && !installing;
  const bsTitle = !baiInstalled ? 'Install BlueAI' : (!winOpen ? 'Open BlueAI' : null);
  const handleBsClick = () => {
    if (!baiInstalled) { setInstalling('blueai'); return; }   // Flow A: the install prompt
    if (!winOpen) openWindow();                                // already installed → just relaunch
  };
  const finishInstall = () => {
    if (installing === 'blueai') { setBaiInstalled(true); setInstalling(null); openWindow(); }
  };

  /* Flow B's scene-level payoff, mount the BlueStacks window and cycle it through its cold-start
     frames. Called by ChatScreen's inline progress card (needs_bluestacks.jsx's ProgressBubble)
     once IT finishes, not by a modal's onComplete, Flow B has no modal anymore. The chat side
     (resuming the original task) is handled entirely inside ChatScreen itself now; this function
     only owns what the DESKTOP SCENE needs to do, which is genuinely parent-owned state. */
  const completeBluestacksInstall = (app) => {
    const B = window.NeedsBluestacks.BS_BOOT;
    setBsInstalled(true);
    setBsScreen('loading');                                       // the player cold-starts…
    setTimeout(() => setBsScreen('home'), B.loading);              // …lands on its home…
    // …then the app's Play listing, but ONLY for an app we hold a listing screenshot of.
    // Otherwise it rests on the home screen rather than showing the wrong app's page.
    const listing = window.NeedsBluestacks.PLAY_FRAME[app];
    if (listing) setTimeout(() => setBsScreen(listing), B.loading + B.home);
  };
  /* Preview panel: flip either install flag. GUARD, turning the last one off would leave a bare
     desktop with nothing on it and no way back, which is not a designed state, so the other one
     turns on instead of allowing it. */
  const toggleInstalled = (which, val) => {
    setInstalling(null);
    if (which === 'bs') {
      setBsInstalled(val);
      if (val) setBsScreen('home');
      if (!val && !baiInstalled) { setBaiInstalled(true); openWindow(); }
    } else {
      setBaiInstalled(val);
      if (val) openWindow();
      if (!val && !bsInstalled) { setBsInstalled(true); setBsScreen('home'); }
    }
  };

  // Chat History / Profile open as full in-app screens (kebab menu routes here).
  const openHistory = () => { setCreditsOpen(false); setProfileOpen(false); setHistoryOpen(true); };
  const openProfile = () => { setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(true); };
  useEffect(() => { window.__openChatHistory = openHistory; return () => { delete window.__openChatHistory; }; }, []);

  /* Sign out signs out (review round 1, U11): back to the logged-out welcome, every pushed screen
     closed. The shared session goes with it, so App Player's account is signed out too (the same
     rule as Switch account, account_gate.jsx) and the next launch shows the sign-in page. */
  const signOut = () => {
    setLogoutOpen(false); setProfileOpen(false); setHistoryOpen(false); setCreditsOpen(false); setActiveTab('chat');
    setIsLoggedIn(false); setOnbPhase('welcome'); setSeed(null); setPendingMessage(null);
    setPlayerAcct('out'); setBrowserResult(null); setSessionKey((k) => k + 1);
  };
  const handleNewChat = () => { setSeed(null); setSessionKey((k) => k + 1); setActiveTab('chat'); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); setLogoutOpen(false); };
  // Onboarding sign-in completes → the message that opened the gate auto-sends in the now
  // logged-in DEFAULT flow (so the conversation starts and the category home is skipped,
  // designer's correction). A fresh sign-in with no queued message just lands on the home.
  // sessionKey bump resets ChatScreen; the autorun seed then fires the queued message.
  const handleLoginSuccess = () => {
    setShowLoginModal(false);
    setBrowserOpen(false);
    setIsLoggedIn(true);
    // MoneyMaker: nothing was typed/queued, the CTA on the welcome page opened this directly,
    // so just reveal the chat home as-is, no seed/sessionKey churn.
    if (loginFlow !== 'onboarding') return;   // moneymaker / gate / confirm: nothing was queued
    setSessionKey((k) => k + 1);
    setSeed(pendingMessage ? { text: pendingMessage, autorun: true, n: Date.now() } : null);
    setPendingMessage(null);
  };
  // Preview-only: flip the Onboarding/Default/MoneyMaker session toggle. The two logged-out
  // variants always re-arm at their start (the chrome-free welcome screen); Default lands on a
  // clean chat tab, already signed in.
  const switchSession = (mode) => { setSessionMode(mode); setIsLoggedIn(mode === 'default'); setOnbPhase('welcome'); setSeed(null); setPendingMessage(null); setSessionKey((k) => k + 1); setActiveTab('chat'); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); };
  // Onboarding picker → chat: prefill the composer with the picked task (empty for "Just type it").
  const startOnboardingChat = (prompt) => { setSeed(prompt ? { text: prompt, n: Date.now() } : null); setSessionKey((k) => k + 1); setActiveTab('chat'); setOnbPhase('chat'); };
  const handleTabChange = (tab) => { setActiveTab(tab); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false); if (tab !== 'chat') setSeed(null); };
  // MoneyMaker's welcome page IS the "please sign in" screen, so its CTA opens LoginModal
  // straight past the 'default' step (see login.jsx's initialStep).
  const handleMoneyMakerSignIn = () => { setLoginFlow('moneymaker'); setShowLoginModal(true); };

  const isChat = activeTab === 'chat';
  // Logged-out cold start sits on the chrome-free welcome picker (no top bar, no bottom nav),
  // matches the design's picker phase. Once a task is picked / "just type it", we enter the chat.
  const onboardingWelcome = !isLoggedIn && onbPhase === 'welcome';

  /* Dev-only preview control: DARK (designer, 2026-08-10: the white card was pulling attention
     off the work). It is a tool sitting on a desktop, not product UI, so it deliberately shares
     nothing with the product's light system: near-black surface, muted ink, and it rests at 88%
     opacity, coming fully forward only on hover. */
  const DEV = {
    surface: '#111524', line: '#242a40', divider: '#1e2335',
    label: '#5f688a', ink: '#8790a8', inkHi: '#c3cade',
    track: '#1b2033', on: '#1a6fc4', onInk: '#ffffff',
    chipOn: 'rgba(25,144,255,0.13)', chipOnLine: '#2f5f96', chipOnInk: '#7db8f5',
    chipOffLine: '#2a3048', chipOffInk: '#6b7390', box: '#3a4160'
  };

  // Compact segmented control sharing one inner track (no per-pill shadow). 3+ options (e.g.
  // Session's Onboarding/Default/MoneyMaker) get the label on its own line above a full-width
  // track instead of squeezing both onto one row, that's what was pushing MoneyMaker past the
  // card's edge. flexWrap is a safety net, not the fix: a still-too-narrow track wraps instead of
  // spilling outside the rounded card.
  const PreviewRow = ({ label, opts, val, set }) => {
    const stacked = opts.length > 2;
    const track = (
      <div style={{ display: 'flex', flexWrap: 'wrap', background: DEV.track, borderRadius: 8, padding: 2, width: stacked ? '100%' : undefined, boxSizing: 'border-box' }}>
        {opts.map(([lbl, v]) => (
          <button key={lbl} onClick={() => set(v)}
            style={{ flex: stacked ? 1 : undefined, border: 'none', borderRadius: 6, padding: '4px 10px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap', background: val === v ? DEV.on : 'transparent', color: val === v ? DEV.onInk : DEV.ink, transition: 'background 0.13s ease, color 0.13s ease' }}>
            {lbl}
          </button>
        ))}
      </div>
    );
    return stacked ? (
      <div style={{ padding: '8px 0' }}>
        <span style={{ display: 'block', fontSize: 10.5, fontWeight: 700, color: DEV.label, marginBottom: 6 }}>{label}</span>
        {track}
      </div>
    ) : (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, padding: '8px 0' }}>
        <span style={{ fontSize: 10.5, fontWeight: 700, color: DEV.label }}>{label}</span>
        {track}
      </div>
    );
  };

  /* Two INDEPENDENT booleans, so they get checkbox chips rather than PreviewRow's either/or
     segments: a segmented pair would imply picking one excludes the other, which is the
     opposite of the model. */
  const InstallChip = ({ label, on, onToggle }) => (
    <button role="checkbox" aria-checked={on} onClick={() => onToggle(!on)}
      style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 6, padding: '6px 8px', borderRadius: 8, cursor: 'pointer', fontFamily: 'inherit', fontSize: 11, fontWeight: 700, textAlign: 'left', transition: 'background 0.13s ease, border-color 0.13s ease, color 0.13s ease', background: on ? DEV.chipOn : 'transparent', border: '1px solid ' + (on ? DEV.chipOnLine : DEV.chipOffLine), color: on ? DEV.chipOnInk : DEV.chipOffInk }}>
      <span style={{ width: 13, height: 13, flexShrink: 0, borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', background: on ? '#1990FF' : 'transparent', border: '1px solid ' + (on ? '#1990FF' : DEV.box) }}>
        {on && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg>}
      </span>
      {label}
    </button>
  );

  /* The installer belongs to the app that raises it, so it renders INSIDE that app's window,
     centred on it, dimming it and nothing else. Only Flow A uses this now (BlueStacks raising
     the prompt to install BlueAI); Flow B's install lives entirely inside the chat instead. */
  const installerCfg = INSTALLERS[installing];
  const bsInstaller = installerCfg
    ? <window.InstallDialog open contained {...installerCfg}
        onCancel={() => setInstalling(null)} onComplete={finishInstall} />
    : null;

  const productWindow = (
    <div className={'ba-win' + (winJustIn ? ' pscene-win-in' : '')}>
      <ProductTitlebar onClose={() => setWinOpen(false)} />
      {/* data-v2-bounds: this is the product window, so the kit's dialog focus hook makes everything
         in it inert under an open overlay, and the kit's menus fit inside it (review round 1). */}
      <div className="ba-app" data-v2-bounds="">
      {onboardingWelcome ? (
        sessionMode === 'moneymaker' ? (
          <window.MoneyMaker.MoneyMakerWelcome onSignIn={handleMoneyMakerSignIn} />
        ) : (
          <window.Onboarding.OnboardingWelcome
            onPick={(item) => startOnboardingChat(item.prompt)}
            onTypeIt={() => startOnboardingChat('')} />
        )
      ) : (
      <>
      <ProductTopBar
        credits={credits}
        lowDot={lowDot}
        isLoggedIn={isLoggedIn}
        onNewChat={handleNewChat}
        onOpenCredits={() => { setHistoryOpen(false); setProfileOpen(false); setCreditsOpen(true); }}
        onOpenHistory={openHistory}
        onOpenProfile={openProfile}
        onSignOut={() => setLogoutOpen(true)}
        onReportIssue={() => setReportOpen(true)} />

      {profileOpen ? (
        <ProfileScreen onSignOut={() => setLogoutOpen(true)} />
      ) : historyOpen ? (
        <HistoryScreen />
      ) : creditsOpen ? (
        <AICreditsScreen credits={credits} keyAdded={keyAdded} byokOn={byokOn} keyInfo={keyInfo} onManageByok={goToByokSettings} />
      ) : isChat ? (
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
          <ProductChatScreen sessionKey={sessionKey} seed={seed} loading={!homeReady} zeroCredits={zeroCredits && !byokActive} onNoCredits={() => setOocOpen(true)} isOnboarding={!isLoggedIn} sessionMode={sessionMode} onNeedLogin={(text) => { setLoginFlow('onboarding'); setPendingMessage(text); setShowLoginModal(true); }} showStates={showChatStates}
            scheduledOoc={scheduledOoc && !byokActive}
            dailyRunKey={dailyRunKey} onJobWaiting={setJobWaiting} permUi={CASES_MODE ? 'none' : permUi} onDayDone={(end) => setToast({ end, key: Date.now() })}
            bsInstalled={bsInstalled} onBsInstalled={completeBluestacksInstall} />
        </div>
      ) : (
        <div key={activeTab} className="v2-anim-fade-up"
          style={{ flex: 1, overflowY: 'auto', padding: '0 var(--v2-gutter) var(--v2-space-5)' }}>
          {activeTab === 'jobs' && <JobsScreen isLoading={isLoading} />}
          {activeTab === 'schedule' && <ScheduleScreen isLoading={isLoading} />}
          {activeTab === 'settings' && <SettingsScreen byok={{ on: byokOn, setOn: setByokOn, keyAdded, keyInfo, onSave: addKey, onRemove: removeKey, highlight: highlightByok }} aiModeConditions={{ hwSupported: aiHwSupported, conflict: aiConflict }} />}
        </div>
      )}

      <BottomNavbar activeTab={creditsOpen || historyOpen || profileOpen ? null : activeTab} onTabChange={handleTabChange} />
      </>
      )}
      <LoginModal
        isOpen={showLoginModal}
        initialStep={loginFlow === 'gate' || loginFlow === 'confirm' ? loginFlow : (loginFlow === 'moneymaker' ? 'browser' : 'default')}
        gateAccount={playerAcct === 'accepted' ? window.SignInPage.ACCOUNTS.primary : window.SignInPage.ACCOUNTS.other}
        playerSwitch={() => { setPlayerAcct('out'); openBrowser(); }}
        onClose={() => { setShowLoginModal(false); setPendingMessage(null); setBrowserOpen(false); }}
        onSuccess={handleLoginSuccess}
        onOpenBrowser={openBrowser}
        browserResult={browserResult}
        onSwitchAccount={() => { setPlayerAcct('out'); if (browserResult) setBrowserSession('out'); openBrowser(); }} />

      <LogoutModal
        isOpen={logoutOpen}
        onCancel={() => setLogoutOpen(false)}
        onConfirm={signOut} />
      <window.Help.ReportIssueDialog isOpen={reportOpen} onClose={() => setReportOpen(false)} />

      {/* The mode sheet, and the "Run jobs automatically?" confirm that opens over it. One
         instance of each here, inside .ba-app, so both are scoped to the product window whichever
         control opened them (the composer chip, the ribbon's Change, Settings, the job ask). */}
      <window.AgentPermissions.ModeSheet />
      <window.AgentPermissions.AutoConfirm />

      {/* Out-of-credits popup on message-send: prime geo → Prime upsell (image 1); non-prime geo → BYOK (image 2). */}
      {/* One card for everyone. V2 has no tiers, so there is no non-member to upsell, and no
         geo without a grant, so the mode that pitched BYOK is unreachable too. */}
      {oocOpen && <window.Byok.OutOfCreditsModal onClose={() => setOocOpen(false)} />}

      {/* Terms sheet: on the gate layer, mounted after the login gate so it sits above it
         (acceptance precedes sign-in), below the boot splash. !booting delays the MOUNT until the splash is done, so the slide-up entrance
         plays where the user can see it instead of finishing behind the splash. Accepting plays
         the exit and then flips the preview row to Off. */}
      {!booting && termsMode !== 'off' && <window.TermsSheet.TermsSheet mode={termsMode} onDone={() => setTermsMode('off')} />}

      {booting && <BootSplash key={sessionKey} onDone={handleBootDone} />}
      </div>
    </div>);

  /* The scene wraps the window; the installer dialog and the dev Preview card sit OUTSIDE it.
     That placement is load-bearing, not tidiness: .pscene-scaler carries a transform, which makes
     it the containing block for any position:fixed descendant, anything fixed rendered inside it
     would be positioned against the scene AND scaled with it. */
  return (
    <>
      <window.DesktopScene
        bsInstalled={bsInstalled}
        winPresent={winPresent}
        bsScreen={bsScreen}
        bsLive={bsLive}
        bsTitle={bsTitle}
        onBsClick={handleBsClick}
        onEmptyClick={openWindow}
        bsOverlay={bsInstaller}
        sideWindow={browserOpen && winPresent ? (
          /* ROB-21388: the browser the app's Sign in opened. Keyed on its setup, so a Preview row
             change restarts it on the matching first page. */
          <window.SignInPage.SignInBrowser key={browserKey + '-' + browserSession + '-' + opt} start={browserSession} always={CASES_MODE && opt === 'b'}
            onContinue={handleBrowserContinue} onClose={() => setBrowserOpen(false)} />
        ) : null}
        aiInstalled={baiInstalled} aiOpen={winPresent} aiAttention={jobWaiting}
        onAiClick={() => { if (!winOpen) openWindow(); }}>
        {winPresent && productWindow}
      </window.DesktopScene>

      {/* The Windows notification a scheduled run raises when its day is done (worker sheet row 2):
         the run happens with nobody watching, so the chat card alone would be missed. A click
         brings BlueAI up. Fixed to the viewport, so it sits OUTSIDE the scaled scene. */}
      {toast && !CASES_MODE && (() => {
        const t = window.WorkerDayDone.toastFor(toast.end);
        return t && <window.DesktopToast key={toast.key} title={t.title} body={t.body}
          onOpen={() => { if (!winOpen) openWindow(); setToast(null); }} onClose={() => setToast(null)} />;
      })()}

      {CASES_MODE && (
        <>
          <style>{'.pscene { top: 56px; }'}</style>
          <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 300, height: 56, display: 'flex', alignItems: 'center', gap: 8, padding: '0 18px', background: 'rgba(17,21,36,0.94)', fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif" }}>
            {SIGNIN_OPTS.map((o) => (
              <button key={o.id} onClick={() => pickOpt(o.id)}
                style={{ height: 32, padding: '0 14px', borderRadius: 8, border: '1px solid ' + (o.id === opt ? '#c3cade' : '#2a3048'), background: o.id === opt ? '#c3cade' : 'transparent', color: o.id === opt ? '#111524' : '#8790a8', fontSize: 12.5, fontWeight: 800, cursor: 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap' }}>{o.label}</button>
            ))}
            <span style={{ width: 1, height: 24, background: '#2a3048', margin: '0 6px' }} />
            {SIGNIN_CASES.map((c) => (
              <button key={c.id} onClick={() => playCase(c.id)}
                style={{ height: 32, padding: '0 14px', borderRadius: 999, border: '1px solid ' + (c.id === caseId ? '#1a6fc4' : '#2a3048'), background: c.id === caseId ? '#1a6fc4' : 'transparent', color: c.id === caseId ? '#fff' : '#8790a8', fontSize: 12.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', whiteSpace: 'nowrap' }}>{c.label}</button>
            ))}
            <button onClick={() => playCase(caseId)} title="Play this case from the start"
              style={{ height: 32, padding: '0 14px', borderRadius: 999, border: '1px solid #2a3048', background: 'transparent', color: '#8790a8', fontSize: 12.5, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>Restart</button>
            <span style={{ marginLeft: 'auto', fontSize: 12.5, lineHeight: 1.35, color: '#8790a8', textAlign: 'right', maxWidth: 560 }}>{SIGNIN_CASES.find((c) => c.id === caseId).note}</span>
          </div>
        </>
      )}

      {CASES_MODE && (
        <button role="checkbox" aria-checked={bsInstalled} onClick={() => toggleInstalled('bs', !bsInstalled)}
          style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 300, display: 'flex', alignItems: 'center', gap: 8, height: 36, padding: '0 14px', borderRadius: 999, border: '1px solid #2a3048', background: 'rgba(17,21,36,0.94)', color: bsInstalled ? '#c3cade' : '#8790a8', fontSize: 12.5, fontWeight: 700, cursor: 'pointer', fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif" }}>
          <span style={{ width: 14, height: 14, borderRadius: 4, display: 'flex', alignItems: 'center', justifyContent: 'center', background: bsInstalled ? '#1990FF' : 'transparent', border: '1px solid ' + (bsInstalled ? '#1990FF' : '#3a4160') }}>
            {bsInstalled && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg>}
          </span>
          Show BlueStacks
        </button>
      )}

      {/* Preview-state dev control: ONE compact card (geo → member/key + credits), collapses to a gear. */}
      {!CASES_MODE && (previewOpen ? (
        /* Bottom-LEFT, not bottom-right: the product window always sits on the right of the
           scene (or centred alone), so a right-docked panel covered its bottom nav. The far
           side can only ever graze the BlueStacks screenshot, which is scenery. */
        <div
          onMouseEnter={(e) => e.currentTarget.style.opacity = '1'}
          onMouseLeave={(e) => e.currentTarget.style.opacity = '0.88'}
          style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 300, width: 300, background: DEV.surface, border: '1px solid ' + DEV.line, borderRadius: 12, boxShadow: '0 12px 38px rgba(0,0,0,0.5)', padding: '9px 14px 11px', opacity: 0.88, transition: 'opacity 0.16s ease' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 2 }}>
            <span style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: '0.09em', color: DEV.label, textTransform: 'uppercase' }}>Preview</span>
            <span style={{ flex: 1 }} />
            <button onClick={copyLink} title="Copy a link that opens this setup"
              style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'none', border: '1px solid ' + DEV.chipOffLine, borderRadius: 6, cursor: 'pointer', color: linkCopied ? DEV.chipOnInk : DEV.ink, padding: '2px 8px', marginRight: 6, fontSize: 10.5, fontWeight: 700, fontFamily: 'inherit', transition: 'color 0.13s ease' }}
              onMouseEnter={(e) => e.currentTarget.style.color = DEV.inkHi} onMouseLeave={(e) => e.currentTarget.style.color = linkCopied ? DEV.chipOnInk : DEV.ink}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg>
              {linkCopied ? 'Copied' : 'Copy link'}
            </button>
            <button aria-label="Collapse preview" onClick={() => setPreviewOpen(false)}
              style={{ background: 'none', border: 'none', cursor: 'pointer', color: DEV.chipOffInk, padding: 2, display: 'flex' }}
              onMouseEnter={(e) => e.currentTarget.style.color = DEV.inkHi} onMouseLeave={(e) => e.currentTarget.style.color = DEV.chipOffInk}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9" /></svg>
            </button>
          </div>
          {/* Progressive disclosure: mirror the product's real dependency chain so only the
             controls that affect the CURRENT screen show. BYOK is universal (prime + non-prime)
             and its toggle is the master switch, "whatever they've switched on will work":
               Session ─ Onboarding (logged out) → nothing else applies
                       └ Default (logged in) → Geo
                            ├ Prime geo → Membership + Own key + Credits*
                            └ Non-prime geo → Own key + Credits*
               (*Credits hidden while running on the user's own key, credits are paused, not consumed.)
             The Own-key toggle mirrors Settings: "Added" flips both keyAdded + byokOn on, so the
             preview state stays in sync with what Settings shows and vice-versa. */}
          {/* What's installed on this PC. Sits at the TOP because it gates everything below it,
             with BlueAI not installed there is no app to configure, so the rest is hidden. */}
          <div style={{ padding: '7px 0 8px' }}>
            <span style={{ display: 'block', fontSize: 9.5, fontWeight: 800, letterSpacing: '0.09em', color: DEV.label, textTransform: 'uppercase', marginBottom: 6 }}>Installed</span>
            <div style={{ display: 'flex', gap: 6 }}>
              <InstallChip label="BlueStacks" on={bsInstalled} onToggle={(v) => toggleInstalled('bs', v)} />
              <InstallChip label="BlueAI" on={baiInstalled} onToggle={(v) => toggleInstalled('bai', v)} />
            </div>
          </div>
          {baiInstalled && <div style={{ height: 1, background: DEV.divider }} />}
          {baiInstalled && (() => {
            // Session row's display label only, renamed 2026-09-09, the 'moneymaker' VALUE stays
            // as the internal session-mode identifier on purpose (code/filenames weren't part of
            // this rename), so switchSession/sessionMode wiring is untouched.
            /* Start at (ROB-21350, local testing): Worker home lands signed in on the BlueAI worker
               home as a brand-new user, now and on every reload, so the flow can be retried
               without the terms sheet and sign-in each time. Sign in restores the real cold start. */
            const startAt = (v) => {
              setProtoStart(v); remember('bai_proto_start', v);
              if (v !== 'worker') { switchSession('moneymaker'); setTermsMode('firstrun'); return; }
              setSessionMode('moneymaker'); setIsLoggedIn(true); setTermsMode('off'); setShowLoginModal(false); setBrowserOpen(false); setOnbPhase('welcome');
              setSeed(null); setActiveTab('chat'); setCreditsOpen(false); setHistoryOpen(false); setProfileOpen(false);
              setWorkerDay('day1'); window.WorkerFlow.setOnboarded(false); window.AgentPermissions.reset(); window.WorkerDayDone.setToday(null);
              setSessionKey((k) => k + 1);
            };
            const rows = [
              <PreviewRow key="protostart" label="Start at" opts={[['Sign in', 'signin'], ['Worker home', 'worker']]} val={protoStart} set={startAt} />,
              <PreviewRow key="session" label="Session" opts={[['Onboarding', 'onboarding'], ['Default', 'default'], ['BlueAI worker', 'moneymaker']]} val={sessionMode} set={switchSession} />,
              // The terms sheet overlays any session, so the row is unconditional. First run
              // leads because it is the default starting experience; the sheet's own CTA flips
              // this to Off (its onDone above).
              <PreviewRow key="terms" label="Terms" opts={[['First run', 'firstrun'], ['Terms update', 'update'], ['Off', 'off']]} val={termsMode} set={setTermsMode} />
            ];
            /* ROB-21388: the three cases. App Player signed out = the app opens the browser; with
               the accepted account = silent sign-in, home; with another account = silent sign-in,
               then the gate. Browser = what bluestacks.ai holds when the browser does open. */
            if (!isLoggedIn || playerAcct !== 'out') {
              const setPlayer = (v) => {
                setPlayerAcct(v); setBrowserOpen(false); setShowLoginModal(false); setBrowserResult(null);
                if (v === 'accepted') { setIsLoggedIn(true); setTermsMode('off'); return; }
                setIsLoggedIn(false); setOnbPhase('welcome'); setSessionKey((k) => k + 1);
                if (v === 'other') { setLoginFlow('gate'); setShowLoginModal(true); }
              };
              rows.push(<PreviewRow key="player" label="App Player" opts={[['Signed out', 'out'], ['Accepted account', 'accepted'], ['Other account', 'other']]} val={playerAcct} set={setPlayer} />);
              rows.push(<PreviewRow key="bsession" label="Browser" opts={[['Accepted account', 'accepted'], ['Other account', 'other'], ['Signed out', 'out']]} val={browserSession} set={setBrowserSession} />);
            }
            if (isChat) rows.push(<PreviewRow key="states" label="Chat states" opts={[['Off', false], ['On', true]]} val={showChatStates} set={setShowChatStates} />);
            /* The scheduled-run-out-of-credits scenario. Its own row rather than a 4th Session
               option on purpose: sessionMode picks which WELCOME + LOGIN + home screen renders,
               and this is none of those, it's a chat that plays itself. Folding it into
               sessionMode would have made it mutually exclusive with the BlueAI-worker session and
               dragged the login wiring along for a state that never signs anyone in.
               Selecting it also flips zeroCredits, because a run dying for lack of credits while
               the top bar still shows a balance is an incoherent screenshot; bumping sessionKey
               replays the script from the top. */
            if (isChat) rows.push(<PreviewRow key="schedooc" label="Scheduled job" opts={[['Off', false], ['Out of credits', true]]} val={scheduledOoc}
              set={(v) => { setScheduledOoc(v); if (v) setZeroCredits(true); setSessionKey((k) => k + 1); }} />);
            /* BlueAI worker end to end (ROB-21350). Change mode from: the control that opens the
               mode sheet, the two shapes going to the seniors (the composer chip, or a ribbon
               above the composer once the worker runs on Automatic). Mode: YouTube's mode, set
               directly with no consent dialog, exactly like ?mode=auto. Worker: Day 1 resets to a
               brand-new user (Run plays onboarding, mode back to Always ask); Next day plays the
               following day's scheduled run in its own chat, again on every click. Setup question:
               whether onboarding asks "take paid jobs on my own, or check with me first?". */
            if (isChat && sessionMode === 'moneymaker' && isLoggedIn) {
              rows.push(<PreviewRow key="permui" label="Change mode from" opts={[['Composer chip', 'chatbox'], ['Ribbon', 'ribbon']]} val={permUi}
                set={(v) => { setPermUi(v); remember('bai_proto_version', v); }} />);
              rows.push(<PreviewRow key="permmode" label="Mode" opts={[['Always ask', 'always'], ['Automatic', 'auto']]} val={permModes.youtube}
                set={(v) => window.AgentPermissions.setMode('youtube', v)} />);
              rows.push(<PreviewRow key="workerday" label="Worker" opts={[['Day 1', 'day1'], ['Returning', 'returning'], ['Next day', 'next']]} val={workerDay}
                set={(v) => {
                  setWorkerDay(v); setSeed(null); setToast(null); window.WorkerDayDone.setToday(null);
                  if (v === 'day1') { window.WorkerFlow.setOnboarded(false); window.AgentPermissions.reset(); }
                  else { window.WorkerFlow.setOnboarded(true); if (v === 'next') setDailyRunKey((k) => k + 1); }
                  setSessionKey((k) => k + 1);
                }} />);
              /* Day end (worker sheet row 2, 2026-10-12): how today's run closes, which is what the
                 day-done card and the notification show. Picking one replays the next day's run. */
              rows.push(<PreviewRow key="dayend" label="Day end" opts={window.WorkerDayDone.ENDS} val={dayEnd}
                set={(v) => {
                  setDayEnd(v); window.WorkerDayDone.setEnd(v); setToast(null); setSeed(null);
                  setWorkerDay('next'); window.WorkerFlow.setOnboarded(true); setDailyRunKey((k) => k + 1); setSessionKey((k) => k + 1);
                }} />);
              /* Card (Abhisht, 2026-10-12): the three options for the moment. Money leads with the
                 dollar; Days shows the count and no money; Plain is no card, only a longer closing
                 line. Replays whatever is on screen so the change shows at once. */
              rows.push(<PreviewRow key="cardstyle" label="Card" opts={window.WorkerDayDone.STYLES} val={cardStyle}
                set={(v) => {
                  setCardStyle(v); window.WorkerDayDone.setStyle(v); setToast(null); setSeed(null);
                  if (workerDay === 'next') setDailyRunKey((k) => k + 1);
                  setSessionKey((k) => k + 1);
                }} />);
              rows.push(<PreviewRow key="jobchoice" label="Setup question" opts={[['On', 'onboarding'], ['Off', 'jobcard']]} val={jobChoice}
                set={(v) => { setJobChoice(v); window.WorkerFlow.setChoicePoint(v); }} />);
            }
            if (activeTab === 'settings') {
              rows.push(<PreviewRow key="aihw" label="Hardware" opts={[['Yes', true], ['No', false]]} val={aiHwSupported} set={setAiHwSupported} />);
              rows.push(<PreviewRow key="aiconflict" label="AI conflict" opts={[['None', false], ['Detected', true]]} val={aiConflict} set={setAiConflict} />);
            }
            if (isLoggedIn) {
              // Geo and Membership rows removed 2026-09-09: with one member type and one geo they
              // selected states the screens no longer distinguish. Own key stays, because BYOK still
              // lives in Settings and still changes what the credits screen reports.
              rows.push(<PreviewRow key="key" label="Own key" opts={[['Off', false], ['On', true]]} val={byokActive} set={(v) => { setKeyAdded(v); setByokOn(v); setKeyInfo(v ? DEFAULT_KEY : null); }} />);
              if (!byokActive) rows.push(<PreviewRow key="credits" label="Credits" opts={[['Full', false], ['Empty', true]]} val={zeroCredits} set={setZeroCredits} />);
            }
            return rows.map((row, i) => (
              <React.Fragment key={row.key}>
                {i > 0 && <div style={{ height: 1, background: DEV.divider }} />}
                {row}
              </React.Fragment>
            ));
          })()}
        </div>
      ) : (
        <button aria-label="Preview state" onClick={() => setPreviewOpen(true)}
          style={{ position: 'fixed', left: 20, bottom: 20, zIndex: 300, width: 38, height: 38, borderRadius: '50%', background: DEV.surface, border: '1px solid ' + DEV.line, boxShadow: '0 10px 28px rgba(0,0,0,0.5)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: DEV.chipOffInk, opacity: 0.88, transition: 'opacity 0.16s ease' }}
          onMouseEnter={(e) => { e.currentTarget.style.color = DEV.chipOnInk; e.currentTarget.style.opacity = '1'; }} onMouseLeave={(e) => { e.currentTarget.style.color = DEV.chipOffInk; e.currentTarget.style.opacity = '0.88'; }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
      ))}
    </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
