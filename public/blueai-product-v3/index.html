<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Resolve all relative script/asset paths against this folder, so the page works at the clean /blueai-product-v3 URL too. -->
  <base href="/blueai-product-v3/" />
  <title>BlueAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

       ("bluestacks" skin) install dialog, see BS_FONT in install_dialog.jsx. Not a
       confirmed match; falls back to Segoe UI if wrong or slow to load. -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- bluestacks.ai's own faces (Inter + Instrument Serif italic), for the pages the app's Sign in
       opens in the browser (site_kit.jsx, ROB-21388). The same link the live site loads. Since V3
       Phase 1 this Inter is also the BlueAI window's base face (--v2-font-ui on .ba-win, at 400, 500
       and 600 only); the link's variable weight range already covers those three. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- The fake Windows desktop the product window sits on (wallpaper, BlueStacks window,
       OS window frame + titlebar). Deliberately a separate file: none of it is product DS. -->
  <link rel="stylesheet" href="product-scene.css" />
  <!-- V3: the design system's Target tokens (--v2-*). Base is /blueai-product-v3/, so this resolves to
       /blueai-product-v2-ds/tokens.css. Read-only here: never edit the DS folder from V3. -->
  <link rel="stylesheet" href="../blueai-product-v2-ds/tokens.css" />
  <!-- Review round 1 (2026-10-14): V3 consumes the design system's kit stylesheets instead of
       re-implementing them. base (reset, type ladder, focus, scrollbar, icon box) and motion (the
       keyframes and the one reduced-motion rule) first, then the parts V3 uses: buttons, links,
       chips and icon buttons; fields and switches; badges, cards and avatars; banners, empty states,
       spinners and skeletons; the overlay (scrim, dialog, sheet, menu); the composer; the top bar,
       nav and splash; the credits chip. V3's own sheets below hold only V3's screen layouts. -->
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/base.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/motion.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/actions.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/inputs.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/display.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/feedback.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/overlays.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/chat.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/shell.css" />
  <link rel="stylesheet" href="../blueai-product-v2-ds/kit/credits.css" />
  <!-- V3, Phase 2: the entry screens (welcome, sign-in modal, account gate) in the onBlue site's
       language on those tokens: step discs, the gate card, the account row. -->
  <link rel="stylesheet" href="entry.css" />
  <!-- V3, Phase 3: the chat screen (bubbles, progress notes, composer extras, home rows, history). -->
  <link rel="stylesheet" href="chat.css" />
  <!-- V3, Phase 4: the worker (mode chip, ribbon, app rows, the run-complete moment's contents, home
       progress and worker card, BlueStacks bubbles, the Schedule tab). -->
  <link rel="stylesheet" href="worker.css" />
  <!-- V3, Phase 5: the screen header, credits, settings, profile, dialog contents and the onboarding
       entry: ledger rows and notes, one settings row. -->
  <link rel="stylesheet" href="settings.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif;
      background: #e2e8f0;
    }
    /* The product window's CONTENT box, still exactly 830px tall (421 x 830, every screen
       inside was designed against it). Its FRAME, border, radius, shadow, and the Windows
       titlebar above it: now lives on .ba-win in product-scene.css, because the window sits
       on a fake Windows desktop instead of a flat page. .ba-win is 866 = 830 + 34 titlebar +
       2 hairline, so this box keeps its full height. `position: relative` is load-bearing:
       every in-app overlay (boot splash, login gate, logout + out-of-credits modals) is
       absolutely positioned against it, which is what scopes them to the window. */
    .ba-app {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--v2-canvas);
      position: relative;
    }
    button, input, textarea, select { font-family: inherit; }
    /* One scrollbar for every scroller (review round 1): the --v2-scroll-* tokens, no rail. */
    ::-webkit-scrollbar { width: var(--v2-scroll-w); height: var(--v2-scroll-w); }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--v2-scroll-thumb); border-radius: var(--v2-radius-pill); }
    ::-webkit-scrollbar-thumb:hover { background: var(--v2-scroll-thumb-hover); }
    @supports not selector(::-webkit-scrollbar) {
      * { scrollbar-width: thin; scrollbar-color: var(--v2-scroll-thumb) transparent; }
    }

    /* Chat feedback's two V3-only moves (the arrivals are the kit's .v2-anim-pop-in / -fade-up). */
    @keyframes baThanksIn { from { opacity: 0; transform: translateX(-3px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes baExpand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .ba-thanks-in { animation: baThanksIn var(--v2-dur-2) var(--v2-ease-out); }

    /* ---- V3 Phase 1: the shell. The top bar, its menus, the bottom nav and the splash are the kit's
       (kit/shell.css, kit/overlays.css, kit/credits.css); only V3's own differences live here: the
       bar has no brand (the title bar carries it), so its actions sit at the end, and New chat is a
       quiet pill sharing the credits chip's line and ink (design-md 30: no filled button in the bar). */
    .ba-topbar-actions { margin-left: auto; }
    .ba-topbar-icons { display: flex; align-items: center; gap: var(--v2-space-05); }
    .ba-newchat {
      display: inline-flex; align-items: center; gap: var(--v2-space-15); flex: none;
      height: var(--v2-control-sm); padding: 0 var(--v2-space-3) 0 var(--v2-space-2);
      border: var(--v2-stroke) solid var(--v2-line); border-radius: var(--v2-radius-pill);
      background-color: var(--v2-surface); color: var(--v2-ink); cursor: pointer; white-space: nowrap;
      font: inherit; font-size: var(--v2-text-13); font-weight: var(--v2-weight-medium); letter-spacing: var(--v2-tracking-label);
      transition: border-color var(--v2-dur-1) var(--v2-ease-standard), background-color var(--v2-dur-1) var(--v2-ease-standard);
    }
    .ba-newchat:hover { border-color: var(--v2-line-hover); background-image: linear-gradient(var(--v2-wash-hover), var(--v2-wash-hover)); }
    .ba-newchat:active { background-image: linear-gradient(var(--v2-wash-press), var(--v2-wash-press)); }
    /* Report issue keeps its warning glyph in the danger ink, also while its row is hovered (the kit
       menu colours the glyph's wrapper; this class sits on the glyph itself, so it wins). */
    .ba-menu-icon--danger { color: var(--v2-danger-ink); }
  </style>
</head>
<body>
<div id="root"></div>

<!-- The design system's focus and menu toolkit (review round 1): the icon set (the menu's external
     glyph), the dialog focus hook (V2Kit.useFocusTrap, useSwapFocus) and the Menu. They read React
     only, and V3 reads them at render time. -->
<script type="text/babel" src="../blueai-product-v2-ds/kit/icons.jsx"></script>

<script type="text/babel" src="../blueai-product-v2-ds/kit/menu.jsx"></script>

<!-- MoneyMaker session variant: the welcome screen, plus the re-export that keeps the post-login

<script type="text/babel" src="blueai/needs_bluestacks.jsx"></script>

<!-- ROB-21388: the browser window the app's Sign in opens, the pages inside it (bluestacks.ai's
     sign-in and continue pages in the site's own language, Google's account chooser), and the
     app's own "under review" card. -->

     overlay like the login gate; previewed via the dev panel's Terms row. -->

<!-- Bring-your-own-key: out-of-credits popups + credits-screen routes (exposes window.Byok) -->
<!-- Credits countdown, the (i) tooltip and the Learn more link (window.CreditsPopupParts), used
     by byok.jsx's popup and AICreditsScreen below, and by the standalone comparison page
     credits-popup-options.html. Loaded before byok.jsx, which reads it at render time. -->
<script type="text/babel" src="blueai/credits_popup_parts.jsx"></script>
<script type="text/babel" src="blueai/byok.jsx"></script>
<!-- BYOK Settings section: the canonical add/manage-key surface (extends window.Byok) -->
<script type="text/babel" src="blueai/byok_settings.jsx"></script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

// Deep-linkable starting state, so a review link can point at the exact screen being discussed:
//   ?bs=1                 BlueStacks installed too        ?bai=0   BlueAI not installed
//   ?dlg=blueai           open Flow A's installer          ?ask=…   auto-send that message
//   ?credits=0            start with zero credits (the out-of-credits popup and AI Credits banner, ROB-21389)
// A bare URL is the canonical starting experience (Abhisht, 2026-09-24): BlueAI installed and
// alone on the desktop, no BlueStacks, so BlueStacks is now opt-IN via ?bs=1, inverted from
// the old "both installed" default.
const QS = new URLSearchParams(location.search);
// ?cases=signin (ROB-21388): the five sign-in cases as a bar across the top and NOTHING else to
// set. No Preview panel. Each case resets the desktop to its starting point; the flow is then
// clicked through. ?case=1|2|3a|3b|3c picks the one to open on.
const CASES_MODE = QS.get('cases') === 'signin';
const SIGNIN_CASES = [
  { id: '1',  label: '1 App Player: accepted', note: 'App Player is signed in with the accepted account.' },
  { id: '2',  label: '2 App Player: other',    note: 'App Player is signed in with a different account.' },
  { id: '3a', label: '3a Browser: accepted',   note: 'App Player is signed out. The browser is signed in with the accepted account.' },
  { id: '3b', label: '3b Browser: other',      note: 'App Player is signed out. The browser is signed in with a different account.' },
  { id: '3c', label: '3c Browser: signed out', note: 'App Player is signed out. So is the browser.' }
];
// Two options (Abhisht, 2026-10-07). A: interrupt only when the account is the wrong one.
// B: whenever an account is already signed in (App Player, or the website), ask "Continue as".
const SIGNIN_OPTS = [{ id: 'a', label: 'A: Check account' }, { id: 'b', label: 'B: Continue as' }];
// ROB-21350 shareable BlueAI-worker setups, so a link opens straight on the case being discussed.
// The Preview panel's "Copy link" builds one from whatever is on screen:
//   ?start=worker   land signed in on the BlueAI worker home (no terms sheet, no sign-in)
//   ?v=1 | ?v=2     change mode from the composer chip | the ribbon above the composer
//   ?setup=off      onboarding without the "take it on my own?" setup question (default: on)
//   ?day=next       play the next day's scheduled worker run as soon as the app opens (implies start=worker)
//   ?day=returning  a returning person on the worker home, before today's run (implies start=worker)
//   ?end=job | nojob | day20 | failed   how today's run ends: the day-done card and the notification
//                   (worker sheet row 2). Implies day=next. Default: job
//   ?card=days | money | plain   which day-done option draws it: the days-led message (ships), the
//                   money-led one, or no message and a longer closing line. Default: days
//   ?mode=auto      start with Automatic on for YouTube (default: Always ask on every app). Skips
//                   the consent dialog: the link stands in for a person who already agreed. The
//                   Preview panel's Mode row sets the same thing.
// ROB-21388 sign-in handoff (the browser window beside the app):
//   ?signin=browser open straight on the sign-in handoff, no terms sheet
//   ?player=out | accepted | other   App Player on this PC: signed out (the app opens the
//                   browser), signed in with the accepted account (silent sign-in, home), or with
//                   another account (silent sign-in, then the in-app gate). Default: out
//   ?browser=accepted | other | out   what bluestacks.ai holds when the browser opens: a session
//                   as the accepted account, as another account, or none. Default: accepted
const LINK = {
  start: ['next', 'returning'].includes(QS.get('day')) || QS.has('end') || QS.get('start') === 'worker' ? 'worker' : (QS.get('start') === 'signin' ? 'signin' : null),
  version: QS.get('v') === '1' ? 'chatbox' : (QS.get('v') === '2' ? 'ribbon' : null),
  setup: QS.get('setup') === 'off' ? 'jobcard' : 'onboarding',
  day: QS.get('day') === 'returning' ? 'returning' : (QS.get('day') === 'next' || QS.has('end') ? 'next' : 'day1'),
  end: ['job', 'nojob', 'day20', 'failed'].includes(QS.get('end')) ? QS.get('end') : 'job',
  card: ['money', 'plain'].includes(QS.get('card')) ? QS.get('card') : 'days',
  mode: QS.get('mode') === 'auto' ? 'auto' : 'always',
  signin: QS.get('signin') === 'browser' || CASES_MODE ? 'browser' : null,
  browser: ['other', 'out'].includes(QS.get('browser')) ? QS.get('browser') : 'accepted',
  player: ['accepted', 'other'].includes(QS.get('player')) ? QS.get('player') : 'out'
};
// Local-testing rows remembered in THIS browser only; a link's own settings win over them.
//   bai_proto_start    'signin' (the real cold start) | 'worker' (land signed in on the worker home)
//   bai_proto_version  'chatbox' (Composer chip) | 'ribbon' (Ribbon)
const PROTO = (() => {
  let saved = {};
  try { saved = { start: localStorage.getItem('bai_proto_start'), version: localStorage.getItem('bai_proto_version') }; } catch (e) { /* private window */ }
  return { start: LINK.start || (LINK.signin ? 'signin' : saved.start) || 'signin', version: LINK.version || saved.version || 'ribbon' };
})();
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private window: this session only */ } };

const START = (() => {
  const bs = QS.get('bs') === '1';
  let bai = QS.get('bai') !== '0';
  if (!bs && !bai) bai = true;   // same guard the Preview chips enforce: never both off
  return { bs, bai };
})();

// Live product configuration (frozen, the Tweaks playground is removed).
const CONFIG = {
  credits: 45812,        // matches the live Windows app
};

// Live header (newer than the export, matched to the live app screenshots):
// credits pill · New chat · "?" help menu (FAQ / Report issue) · kebab (Chat history / Profile / Earnings ↗ / Sign out).
// Logged-out (onboarding): strips to just the brand lockup, no credits/New Chat/help/kebab, matching the cold start.
function ProductTopBar({ credits, lowDot, isLoggedIn, onNewChat, onOpenHistory, onOpenCredits, onOpenProfile, onSignOut, onReportIssue }) {
  const Menu = window.V2Kit.Menu;
  const ClockIcon = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="v2-icon"><circle cx="12" cy="12" r="9" /><polyline points="12 7 12 12 15 14" /></svg>;
  const PersonIcon = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="v2-icon"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
  const SignOutIcon = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="v2-icon"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>;
  /* FAQ replaces the Discord entry (PM, 2026-09-10). It carries the SAME question-mark glyph as the
     help trigger that opens this menu (Appy, 2026-09-10). I had drawn a book instead, reasoning that
     repeating the trigger's own icon inside the menu would just echo the control you pressed; the
     designer's call is that the echo is the point, since it ties the entry to the help affordance.
     Paths are identical to the trigger's, drawn at the menu's 16px with the row's ink-3 (the kit's
     menu wraps every glyph in .v2-menu-icon, which colours it), so it sits in the same outline family
     as the other rows. The Discord logo this replaces was the only filled, brand-coloured glyph here. */
  const FaqIcon = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="v2-icon"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>;
  const WarnIcon = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="v2-icon ba-menu-icon--danger"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
  /* Earnings row (Abhisht + Ashish, 2026-09-30): the way from the app to the partner dashboard on
     the onBlue site (earnings + cash out, program progress, payout rules). Labelled "Earnings"
     rather than "Dashboard": the page carries more than money, but money is what users open it
     for, and the label names the motive. It is the one EXTERNAL entry in this menu, so it opens a
     new tab and carries the kit menu's trailing arrow-out glyph. The leading icon is a dollar sign
     in a circle, drawn in the same outline family as the other rows, and echoing the "$" tile on
     the BlueAI worker card. Not a wallet: "Wallet" is the crypto concept the product is dropping.
     Sits after Profile (account things together), before Sign out (which stays last). Destination:
     the one dashboard link (shared.jsx BlueAILinks, review round 1), the deployed Vesper page as a
     stand-in for the real dashboard URL, which the product team owns. */
  const EarningsIcon = <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="v2-icon"><circle cx="12" cy="12" r="10" /><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" /><line x1="12" y1="18" x2="12" y2="6" /></svg>;

  /* V3 Phase 1, the Target top bar (design-md 30), on the kit since review round 1: 52 tall, surface,
     one hairline, no shadow (.v2-topbar); no logo (the title bar already carries it, Appy
     2026-10-14), so the actions sit at the end; the kit's credits chip (the low dot in the danger
     ink); New chat as a quiet pill sharing the chip's line and ink; Help and More as the kit's 32px
     icon buttons, ink on the press wash while their menu is open. Both menus are the kit's Menu
     (kit/menu.jsx, review round 1, U17): the first item takes focus on open, arrows, Home and End
     move, Esc and Tab close and focus returns to the button. No dead rows (U16): FAQ opens the
     site's FAQ, Report issue opens its dialog, Sign out its confirm. */
  const helpItems = [

  return (

      {isLoggedIn &&
      <div className="v2-topbar-actions ba-topbar-actions">

        <button type="button" className={'v2-credits-chip' + (lowDot ? (credits === 0 ? ' v2-credits-chip--empty' : ' v2-credits-chip--low') : '')} onClick={onOpenCredits}
          aria-label={'AI credits: ' + credits.toLocaleString('en-US') + (lowDot ? ', running low' : '')}>
          <span className="v2-credits-chip-pill">
            <img src="assets/Credits.svg" alt="" className="v2-icon v2-icon--credits" onError={(e) => { e.target.style.display = 'none'; }} />
            <span className="v2-credits-chip-value">{credits.toLocaleString('en-US')}</span>
            {lowDot && <span className="v2-credits-chip-dot" aria-hidden="true" />}
          </span>
        </button>
        {/* New chat */}
        <button type="button" className="ba-newchat" onClick={onNewChat}>
          <svg className="v2-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
          New chat

        <div className="ba-topbar-icons">
          <Menu label="Help" items={helpItems} trigger={(t) =>
            <button type="button" className="v2-icon-button" aria-label="Help" {...t}>

            </button>} />
          <Menu label="More options" items={moreItems} trigger={(t) =>
            <button type="button" className="v2-icon-button" aria-label="More options" {...t}>
              <svg className="v2-icon v2-icon--20" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.5" /><circle cx="12" cy="12" r="1.5" /><circle cx="12" cy="19" r="1.5" /></svg>

}

// AI Credits screen. BYOK is universal (prime + non-prime) and the BYOK toggle is the master
// switch: "whatever they've switched on will work" (PM). So when a key is added AND BYOK is on,
// this screen shows the "running on your own key" state in ANY geo, with the credit balance
// preserved/paused underneath; otherwise it shows the geo-specific credit view.
/* V2's AI Credits screen. V2's credit model is deliberately small: no membership tiers, no geo
   split, no top-up. Every member is granted 2000 credits a day automatically, so the screen has
   only two things to say, and which one shows depends purely on whether that grant is spent.

   Everything sold or offered is GONE, per the designer's list: the Prime upsell (5000 a month,
   view all benefits, try for $3.99), the "Or add your own key" link, the "MORE WAYS TO GET AI
   CREDITS" stack (earn 1,000 / claim 25,000), every Top Up button, and the Credit Breakdown
   section. In V2 none of those describe anything real, and a screen offering purchases that do
   not exist is worse than a screen with less on it.

   LAYOUT (2026-09-09, option A of three put to the designer). Removing the upsell stack left the
   content floating on the bare canvas with roughly 55% of the panel empty below it, which read as
   a page that had stopped early rather than a page that was finished. The fix is not spacing, it
   is EDGES: the balance lives in ONE card that fills the panel, rather than floating bare. Two
   reasons, both still true after the meter was removed:

     1. Cards are this product's own idiom (chat cards, settings cards, and this screen's own BYOK
        branch below). Bare content on canvas was the outlier here, not the norm.
     2. A card that FILLS the height turns the empty region into card interior, with the balance
        optically centered in it, so the space is composition rather than absence. minHeight keeps
        it honest in a short window, where the container scrolls instead of crushing the card.

   A third reason is deliberately struck out rather than kept: the original argument for one card
   and not two was that the balance and the daily meter were the same subject, so splitting them
   would divide one fact in two. With the meter gone there is only one thing in the card, so that
   reason no longer carries any weight and leaving it would misrepresent why this is one card.

   DAILY SPEND LIMIT REMOVED (2026-09-10, Appy). It was the last thing in the card besides the
   balance, and it went with its divider: a rule whose only job was separating the meter from the
   balance divides nothing once the meter is gone. V2 grants a flat 2000 a day with no way to
   change it, so a user-set spend cap described a control that does not exist here. The card's
   padding is symmetric now that nothing anchors its foot. It was the only such reference in V2;
   "anywhere else" turned out to be nowhere else.

   BYOK survives as a STATUS, not an invite. Adding a key lives in Settings now, but a key being
   on changes what the balance MEANS (credits stop being consumed), so the screen still reports it.
   That is the one branch here that is not about the balance.

   Copy is the designer's, verbatim.

   V3, Phase 5 (settings.css .v3-cr-*, kit cards and badges since review round 1): the site's money language. The balance is one ink figure
   (600, tight tracking, tabular) beside the credits glyph, the only place the cyan to violet art
   survives (it is the glyph's own drawing, never text or a surface). The explainer sits under the
   ledger's hairline in the same card, as a note. Out of credits is a page-level note in the panel
   surface, not a red alarm: running out is a wait, not a failure, and the chip's low dot carries the
   signal across. The card is in flow, so a 1px line and no shadow. Own key: one ink title, the
   verified-green "Active" badge (the site's Live chip), the provider and model as neutral facts,
   and a routine ghost button to Settings. */
function AICreditsScreen({ credits, keyAdded, byokOn, keyInfo, onManageByok }) {
  const byokActive = keyAdded && byokOn;
  const out = credits === 0;
  // 2026-10-06 review (ROB-21389): the zero note says WHEN credits return and carries an (i)
  // that explains them; the healthy state gets a Learn more link. Shared pieces in
  // credits_popup_parts.jsx. The refill lands at 00:00 UTC.
  const CP = window.CreditsPopupParts;
  const nowTs = CP.useNow();
  const refillIn = CP.formatLeft(CP.nextUtcMidnight(nowTs) - nowTs);

  return (
    <div className="v2-anim-fade-up v3-screen">
      {/* No Refresh button (review round 1, U16): it did nothing, and the balance is live. */}
      <ScreenHead title="AI Credits" />

      {byokActive ? (
        /* Running on the user's own key. Reports the state and routes to Settings, which is where
           keys are managed now. It does not invite anyone to add one. */
        <div className="v3-screen-body v3-screen-body--fit">
          <div className="v2-card">
            <div className="v3-cr-key">
              <span className="v3-cr-key-mark" aria-hidden="true">
                <svg className="v2-icon v2-icon--20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"><circle cx="7.5" cy="15.5" r="5.5" /><path d="m21 2-9.6 9.6" /><path d="m15.5 7.5 3 3L22 7l-3-3" /></svg>
              </span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p className="v2-text-title v3-cr-key-title">Running on your own key <span className="v2-badge v2-badge--success"><span className="v2-badge-dot" aria-hidden="true" /><span className="v2-badge-label">Active</span></span></p>
                <p className="v2-text-body-sm v3-set-desc">No BlueAI credits are consumed while this is on.</p>
              </div>
            </div>
            <div className="v3-cr-facts">
              <span className="v2-badge"><span className="v2-badge-label">{(keyInfo && keyInfo.provider) || 'Your provider'}</span></span>
              <span className="v2-badge v3-mono"><span className="v2-badge-label">{(keyInfo && keyInfo.model) || 'default model'}</span></span>
            </div>
            <button type="button" onClick={onManageByok} className="v2-button v2-button--secondary v2-button--full">
              Manage in Settings
              <svg className="v2-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6" /></svg>
            </button>
          </div>
        </div>
      ) : (
        <div className="v3-screen-body">
          {/* Out of credits sits ABOVE the card, not inside it: it is a page-level status about why
             the number below is zero. Informational only, with no action, because there is no
             action to offer. The grant returns tomorrow on its own. Its tooltip opens downward
             over the card below, which holds only the 0. The (i) sits out of flow (.v3-titled),
             so the title stays centred. */}
          {out &&
            <div className="v3-cr-out">
              <p className="v3-titled v3-cr-out-title"><span className="v3-low-dot" aria-hidden="true" />Out of credits<CP.InfoTip dir="down" /></p>
              <p className="v2-text-body-sm v3-cr-text">
                <span>You&rsquo;ve used all of today&rsquo;s AI credits.</span>
                <span>Credits will be refreshed in <strong>{refillIn}</strong>.</span>
              </p>
            </div>}

          <div className="v2-card v3-cr-card">
            <div className="v3-cr-figure">
              <img src="assets/Credits.svg" alt="" className="v3-cr-glyph" />
              <span className="v2-text-display">{credits.toLocaleString('en-US')}</span>
            </div>
            {/* The explainer is the healthy state's only copy. When the balance is zero the note
               above already says what spends credits and when they return. PM's two lines
               (2026-09-10): what credits are for, then the constraint; the reassurance that they
               return lives at the zero-balance moments (the note above, the on-send popup in
               byok.jsx, the scheduled run's warning in chat_bubbles.jsx). */}
            {!out &&
              <div className="v3-cr-explain">
                <p className="v2-text-title-sm">BlueAI runs on credits</p>
                <p className="v2-text-body-sm v3-cr-text">
                  <span>Every task and job BlueAI does uses credits.</span>
                  <span>You get limited credits for your daily tasks.</span>
                </p>
                {/* Opens the website article at its AI credits section. */}
                <CP.LearnLink style={{ marginTop: 'var(--v2-space-3)' }} />
              </div>}
          </div>
        </div>
      )}
    </div>);
}
